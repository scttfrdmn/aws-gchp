# FULLCHEM ON BIG-MEMORY GRAVITON5 (us-east-1a, m9g.48xlarge).
# Purpose: run C180 fullchem — which does NOT fit hpc7g (128 GB; OOMs at ~126 GB during DYNAMICS init)
# — on m9g.48xl (192 cores, 768 GB, EFA). Uses the STOCK validated aarch64 GCHP 14.7.1 binary (no
# rebuild); the MAPL component split comes free from MAPL_ENABLE_TIMERS: YES. Three tiers:
#   /sw     EBS, validated aarch64 stack synced from S3 (includes the stock gchp binary)
#   /input  FSx Lustre by-ID (fs-0804c4d8e01897d21, gcgrid, us-east-1a) — REUSED, already hydrated
#   /scratch FSx Lustre SCRATCH_2, writable run dirs + outputs (deleted with cluster)
# EFA ENABLED. PlacementGroup OFF (ablation: minimal benefit on EFA, eases m9g capacity).

Region: us-east-1
Image:
  Os: alinux2023

HeadNode:
  InstanceType: c7g.4xlarge          # ARM, cheap build/login host; compute is the m9g
  Networking:
    SubnetId: subnet-2eec4a71         # us-east-1a (same AZ as the kept input FSx + m9g availability)
  Ssh:
    KeyName: aws-gchp
  Iam:
    AdditionalIamPolicies:
      - Policy: arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
      - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  CustomActions:
    OnNodeConfigured:
      Script: s3://gchp-shared-storage-us-east-1/bootstrap/sync-stack-arm.sh

Scheduling:
  Scheduler: slurm
  SlurmSettings:
    ScaledownIdletime: 5
  SlurmQueues:
    - Name: compute
      ComputeResources:
        - Name: nodes
          InstanceType: m9g.48xlarge
          MinCount: 0
          MaxCount: 2                 # 1-node for the memory/throughput headline; 2-node if capacity
          DisableSimultaneousMultithreading: true   # Graviton = 1 thread/core already; explicit
          Efa:
            Enabled: true
            GdrSupport: false
      Networking:
        SubnetIds:
          - subnet-2eec4a71
        PlacementGroup:
          Enabled: false
      CapacityType: ONDEMAND

SharedStorage:
  - Name: software
    StorageType: Ebs
    MountDir: /sw
    EbsSettings:
      VolumeType: gp3
      Size: 120
      DeletionPolicy: Delete
  - Name: input
    StorageType: FsxLustre
    MountDir: /input
    FsxLustreSettings:
      FileSystemId: fs-0804c4d8e01897d21   # gcgrid, us-east-1a, already hydrated (TT + fullchem GMI)
  - Name: scratch
    StorageType: FsxLustre
    MountDir: /scratch
    FsxLustreSettings:
      StorageCapacity: 1200
      DeploymentType: SCRATCH_2
      DeletionPolicy: Delete

Tags:
  - Key: Project
    Value: GCHP-Benchmark
  - Key: Benchmark
    Value: fullchem-m9g
